name: Temporary Openday state integrity check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tmp-openday-state-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect private state without printing contents
        id: inspect
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KK_SYLLABUS }}
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const c=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'null');
          if(!c?.client_email||!c?.private_key)throw Error('credential unavailable');
          const enc=v=>Buffer.from(JSON.stringify(v)).toString('base64url'),now=Math.floor(Date.now()/1000);
          const unsigned=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iss:c.client_email,scope:'https://www.googleapis.com/auth/datastore',aud:c.token_uri||'https://oauth2.googleapis.com/token',iat:now,exp:now+3600});
          const sig=crypto.sign('RSA-SHA256',Buffer.from(unsigned),c.private_key).toString('base64url');
          (async()=>{
            const tr=await fetch(c.token_uri||'https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:unsigned+'.'+sig})});
            if(!tr.ok)throw Error('oauth');
            const {access_token}=await tr.json();
            const url='https://firestore.googleapis.com/v1/projects/kk-syllabus/databases/(default)/documents/app_private_state/openday';
            const dr=await fetch(url,{headers:{Authorization:'Bearer '+access_token}});
            if(!dr.ok)throw Error('doc');
            const doc=await dr.json(), raw=doc.fields?.state?.mapValue?.fields||{};
            const array=k=>(raw[k]?.arrayValue?.values||[]).map(v=>v.stringValue||'');
            const mapKeys=k=>Object.keys(raw[k]?.mapValue?.fields||{});
            const target=['rooks-heath','claremont'];
            const flags={
              document:!!doc.name,
              state:!!doc.fields?.state,
              catalogSenior:!!doc.fields?.catalogSenior,
              saved:target.every(x=>array('saved').includes(x)),
              notes:target.every(x=>mapKeys('notes').includes(x)),
              booked:target.every(x=>mapKeys('booked').includes(x)),
              overrides:target.every(x=>mapKeys('eventOverrides').includes(x))
            };
            const out=process.env.GITHUB_OUTPUT;
            for(const [k,v] of Object.entries(flags))fs.appendFileSync(out,k+'='+(v?'yes':'no')+'\n');
          })().catch(e=>{console.error('private state check failed');process.exit(2)});
          NODE
      - name: A
        continue-on-error: true
        run: test "${{ steps.inspect.outputs.document }}" = yes
      - name: B
        continue-on-error: true
        run: test "${{ steps.inspect.outputs.state }}" = yes
      - name: C
        continue-on-error: true
        run: test "${{ steps.inspect.outputs.catalogSenior }}" = yes
      - name: D
        continue-on-error: true
        run: test "${{ steps.inspect.outputs.saved }}" = yes
      - name: E
        continue-on-error: true
        run: test "${{ steps.inspect.outputs.notes }}" = yes
      - name: F
        continue-on-error: true
        run: test "${{ steps.inspect.outputs.booked }}" = yes
      - name: G
        continue-on-error: true
        run: test "${{ steps.inspect.outputs.overrides }}" = yes
