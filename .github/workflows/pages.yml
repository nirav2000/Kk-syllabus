name: Test and deploy Pages
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate Firebase Functions syntax
        run: |
          node --check functions/index.js
          node --check functions/beyond100-review.js
      - name: Prepare public web files
        run: |
          mkdir -p public
          cp index.html styles.css garden.css sw.js manifest.webmanifest public/
          cp -r src public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - id: deployment
        uses: actions/deploy-pages@v4
