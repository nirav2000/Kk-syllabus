name: Translation Lab — isolated cloud deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-translation-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-translation-lab
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          ref: 5e8284bdf18c6106443471ddd50ea97a3c10a4ce
          path: shared-apps
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated gateway
        run: |
          node --check shared-apps/translation/v1/worker.mjs
          node --test shared-apps/translation/v1/worker.test.mjs
      - name: Deploy only Translation Lab and optional existing translation keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_TRANSLATE_KEY: ${{ secrets.GOOGLE_TRANSLATE_KEY || secrets.GOOGLE_CLOUD_TRANSLATION_API_KEY || secrets.GOOGLE_TRANSLATION_API_KEY }}
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY || secrets.DEEPL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          umask 077
          node --input-type=module <<'NODE'
          import {firebaseConfig,OWNER_UID} from './src/firebase-config.js';
          import {writeFileSync} from 'node:fs';
          if(firebaseConfig.projectId!=='kk-syllabus'||!OWNER_UID||!firebaseConfig.apiKey)throw Error('Firebase owner configuration mismatch');
          const config={name:'translation-lab',main:'worker.mjs',compatibility_date:'2026-11-26',workers_dev:true,vars:{OWNER_UID,FIREBASE_WEB_API_KEY:firebaseConfig.apiKey},ai:{binding:'AI'},durable_objects:{bindings:[{name:'LIMITS',class_name:'Limits'}]},migrations:[{tag:'v1',new_sqlite_classes:['Limits']}]};
          writeFileSync('shared-apps/translation/v1/wrangler.json',JSON.stringify(config));
          console.log('Dedicated worker configuration prepared; no credentials logged.');
          NODE
          cd shared-apps/translation/v1
          npx --yes wrangler@4 deploy --config wrangler.json
          if [ -n "$GOOGLE_TRANSLATE_KEY" ]; then
            printf '%s' "$GOOGLE_TRANSLATE_KEY" | npx --yes wrangler@4 secret put GOOGLE_TRANSLATE_KEY --config wrangler.json
          else
            echo 'No existing Google Translation API key found among supported repository secret names.'
          fi
          if [ -n "$DEEPL_AUTH_KEY" ]; then
            printf '%s' "$DEEPL_AUTH_KEY" | npx --yes wrangler@4 secret put DEEPL_AUTH_KEY --config wrangler.json
          else
            echo 'No existing DeepL API key found among supported repository secret names.'
          fi
      - name: Verify deployed health, owner auth, provider readiness and Firestore access
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KK_SYLLABUS }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {firebaseConfig,OWNER_UID} from './src/firebase-config.js';
          import {mintFrenchFirebaseToken} from './shared-apps/french-teaching/v1/firebase-passkey-bridge.js';
          import {webcrypto} from 'node:crypto';
          const root='https://translation-lab.nirav2000-github.workers.dev';
          const headers={Origin:'https://nirav2000.github.io','Content-Type':'application/json'};
          let health;
          for(let i=0;i<20;i++){
            try{const r=await fetch(root+'/health?check='+i,{signal:AbortSignal.timeout(10000)});if(r.ok){const h=await r.json();if(h.build==='translation-gateway-v1.1.0'&&h.authConfigured&&h.quotaConfigured&&h.aiConfigured){health=h;break}}}catch{}
            await new Promise(r=>setTimeout(r,4000));
          }
          if(!health)throw Error('Worker health verification failed');
          console.log('PASS: expected Worker build, auth, quota and AI binding live.');
          const post=(body,extra={})=>fetch(root+'/',{method:'POST',headers:{...headers,...extra},body:JSON.stringify(body),signal:AbortSignal.timeout(45000)});
          if((await post({action:'status'})).status!==401)throw Error('Anonymous request not denied');
          if((await post({action:'status'},{Authorization:'Bearer invalid.token.here'})).status!==401)throw Error('Forged token not denied');
          if((await post({action:'status'},{Origin:'https://invalid.example'})).status!==403)throw Error('Foreign origin not denied');
          console.log('PASS: anonymous, forged and cross-origin requests rejected.');
          const account=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'null');
          if(account?.project_id!=='kk-syllabus')throw Error('Existing Firebase signing account unavailable');
          const jwt=await mintFrenchFirebaseToken(account,{cryptoImpl:webcrypto});
          const exchange=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key='+encodeURIComponent(firebaseConfig.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:jwt,returnSecureToken:true}),signal:AbortSignal.timeout(20000)});
          if(!exchange.ok)throw Error('Firebase exchange failed HTTP '+exchange.status);
          const {idToken}=await exchange.json();
          if(!idToken)throw Error('Firebase did not return ID token');
          const claims=JSON.parse(Buffer.from(idToken.split('.')[1],'base64url').toString());
          if(claims.sub!==OWNER_UID||claims.aud!=='kk-syllabus')throw Error('Firebase owner mismatch');
          const auth={Authorization:'Bearer '+idToken};
          const status=await post({action:'status'},auth);
          if(!status.ok)throw Error('Authorised gateway request rejected: HTTP '+status.status);
          const ready=await status.json();
          console.log('PASS: authenticated gateway status; provider readiness '+JSON.stringify(ready));
          const firestore=await fetch('https://firestore.googleapis.com/v1/projects/kk-syllabus/databases/(default)/documents/families/'+OWNER_UID+'/learners/adult/progress/translation-lab-healthcheck-read-only',{headers:auth,signal:AbortSignal.timeout(20000)});
          if(![200,404].includes(firestore.status))throw Error('Firestore access failed HTTP '+firestore.status);
          console.log('PASS: owner-only Firestore progress access. No user data read or written by test.');
          const ai=await post({action:'explain',prompt:'Explain in English the French expression Bonjour. Give a short answer.'},auth);
          const result=await ai.json();
          if(!ai.ok||typeof result.explanation!=='string'||!result.explanation.trim())throw Error('Live AI generation failed HTTP '+ai.status);
          console.log('PASS: real Workers AI response received.');
          if(ready.google||ready.deepl){
            const r=await post({action:'translate',source:'Good morning',from:'en',to:'fr',deepl:ready.deepl},auth);
            const out=await r.json();
            if(!r.ok||(ready.google&&!out.google)||(ready.deepl&&!out.deepl))throw Error('Configured provider live translation failed: '+JSON.stringify(out.errors||[]));
            console.log('PASS: configured translation providers returned real results.');
          }
          if(!ready.google)console.log('LIMITATION: Google Cloud Translation API key not configured.');
          if(!ready.deepl)console.log('LIMITATION: optional DeepL API key not configured.');
          NODE
