name: Temporary Openday storage count

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tmp-openday-storage-count.yml"

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count Openday Firestore records without revealing private contents
        id: inspect
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KK_SYLLABUS }}
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const c=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'null');
          if(!c?.client_email||!c?.private_key)throw Error('credential unavailable');
          const enc=v=>Buffer.from(JSON.stringify(v)).toString('base64url'),now=Math.floor(Date.now()/1000);
          const unsigned=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iss:c.client_email,scope:'https://www.googleapis.com/auth/datastore',aud:c.token_uri||'https://oauth2.googleapis.com/token',iat:now,exp:now+3600});
          const sig=crypto.sign('RSA-SHA256',Buffer.from(unsigned),c.private_key).toString('base64url');
          (async()=>{
            const tr=await fetch(c.token_uri||'https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:unsigned+'.'+sig})});
            if(!tr.ok)throw Error('oauth');
            const {access_token}=await tr.json();
            const headers={Authorization:'Bearer '+access_token};
            const ownerUrl='https://firestore.googleapis.com/v1/projects/kk-syllabus/databases/(default)/documents/app_private_state/openday';
            const or=await fetch(ownerUrl,{headers});
            let ownerExists=false,activeToken=false;
            if(or.ok){ownerExists=true;const d=await or.json();activeToken=!!d.fields?.activeTokenHash?.stringValue}
            else if(or.status!==404)throw Error('owner doc read '+or.status);
            const listUrl='https://firestore.googleapis.com/v1/projects/kk-syllabus/databases/(default)/documents/openday_sync?pageSize=1000';
            const lr=await fetch(listUrl,{headers});
            if(!lr.ok)throw Error('token collection read '+lr.status);
            const l=await lr.json(),docs=l.documents||[];
            let active=0,inactive=0;
            for(const d of docs){const a=d.fields?.active?.booleanValue;if(a===true)active++;else inactive++}
            const out=process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out,'owner_exists='+(ownerExists?'yes':'no')+'\n');
            fs.appendFileSync(out,'owner_active_token='+(activeToken?'yes':'no')+'\n');
            fs.appendFileSync(out,'token_docs='+docs.length+'\n');
            fs.appendFileSync(out,'active_token_docs='+active+'\n');
            fs.appendFileSync(out,'inactive_token_docs='+inactive+'\n');
          })().catch(e=>{console.error(e.message);process.exit(2)});
          NODE
      - name: Owner document present
        run: echo "owner_exists=${{ steps.inspect.outputs.owner_exists }}"
      - name: Owner references active token
        run: echo "owner_active_token=${{ steps.inspect.outputs.owner_active_token }}"
      - name: Token capability documents
        run: echo "token_docs=${{ steps.inspect.outputs.token_docs }}"
      - name: Active token capabilities
        run: echo "active_token_docs=${{ steps.inspect.outputs.active_token_docs }}"
      - name: Inactive token capabilities
        run: echo "inactive_token_docs=${{ steps.inspect.outputs.inactive_token_docs }}"
