name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-rules.yml"

permissions:
  contents: read

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KK_SYLLABUS }}
          token_format: access_token

      - name: Validate Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const c=require("./firebase.json"); if (c.firestore?.rules !== "firestore.rules") throw new Error("firebase.json is not wired to firestore.rules");'
          test -s firestore.rules

      - name: Create Firestore ruleset
        id: ruleset
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const rules=fs.readFileSync('firestore.rules','utf8');
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/ruleset-request.json',
            JSON.stringify({source:{files:[{name:'firestore.rules',content:rules}]}})
          );
          NODE

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/ruleset-request.json" \
            "https://firebaserules.googleapis.com/v1/projects/kk-syllabus/rulesets" \
            > "$RUNNER_TEMP/ruleset-response.json"

          RULESET_NAME="$(node -e 'const r=require(process.argv[1]); if(!r.name) throw new Error("Rules API returned no ruleset name"); process.stdout.write(r.name)' "$RUNNER_TEMP/ruleset-response.json")"
          echo "ruleset_name=$RULESET_NAME" >> "$GITHUB_OUTPUT"
          echo "Created ruleset: $RULESET_NAME"

      - name: Release ruleset to Cloud Firestore
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RULESET_NAME: ${{ steps.ruleset.outputs.ruleset_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/release-request.json',
            JSON.stringify({
              name:'projects/kk-syllabus/releases/cloud.firestore',
              rulesetName:process.env.RULESET_NAME
            })
          );
          NODE

          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/release-request.json" \
            "https://firebaserules.googleapis.com/v1/projects/kk-syllabus/releases/cloud.firestore?updateMask=rulesetName" \
            > "$RUNNER_TEMP/release-response.json"

          node -e 'const r=require(process.argv[1]); if(r.rulesetName!==process.env.RULESET_NAME) throw new Error("Release did not point at the new ruleset"); console.log("Released:",r.name,"->",r.rulesetName)' "$RUNNER_TEMP/release-response.json"

      - name: Remove temporary request files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ruleset-request.json" "$RUNNER_TEMP/ruleset-response.json" "$RUNNER_TEMP/release-request.json" "$RUNNER_TEMP/release-response.json"
