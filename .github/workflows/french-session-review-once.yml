name: One-time encrypted French learning diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/french-session-review-once.yml'
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'nirav2000/Kk-syllabus' && github.ref == 'refs/heads/main' && github.event.before == '7cfcefaab471da18a918a611e0b71a07eb3bc760'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          ref: b9231276bfb8dec5afe3c01d80b46a1adebdd8e0
          path: apps
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve scoped events and encrypt locally
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KK_SYLLABUS }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {webcrypto,randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          import {gzipSync} from 'node:zlib';
          import {mintFrenchFirebaseToken} from './apps/french-teaching/v1/firebase-passkey-bridge.js';
          const dayStart=Date.parse('2026-11-27T00:00:00Z'), start=Date.parse('2026-11-27T19:28:00Z'), end=Date.parse('2026-11-27T19:58:00Z'), dayEnd=Date.parse('2026-11-27T20:00:00Z');
          const expectedUid='2AJSfYdtg5URWHv7HCzpNMmKIlg2';
          const publicKey="-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvP5klp533GT2nXV3Muws\nfjvKogm1w7mXKPq+Hp4Woiyao7bANdKB4OU3IUdvQx9G/+oWS4dtaV4yyZ69VNYc\nsZ99IQFlYpWRHe+pmvjPdohJvRxnq0/ZV+o/mF4KRULJ1CQhz5k3JRJec+Aaxr9W\nLdTr4RCpYVzjhfHsG1JanJWtuwxbPv1g6uKZs2I4xlokhHE5M5WxQ4ItUOqjJeQI\noQTig8WJ7J57QiXgnGqm8JYxwQqhZwBuGRb4t3uBvxFFuPz3HC+xqx8ahdyFKnnG\ncvgUyCRzGTfMh5UcsxyeS3HK4PObrxMysGbBecnrLCUkxVll6wML3v6oKIc5DOVs\n9wIDAQAB\n-----END PUBLIC KEY-----";
          const norm=s=>String(s??'').normalize('NFC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?,;:«»“”"]+/g,' ').replace(/\s+/g,' ').trim();
          const target=norm("Hier, j’ai préparé le déjeuner et j’ai réservé une table.");
          const by=(rows,fn)=>{const o={};for(const x of rows){const k=String(fn(x)||'(none)');o[k]=(o[k]||0)+1;}return o};
          function unpack(x){
           if(!x||'nullValue'in x)return null;
           if('stringValue'in x)return x.stringValue;
           if('integerValue'in x)return Number(x.integerValue);
           if('doubleValue'in x)return x.doubleValue;
           if('booleanValue'in x)return x.booleanValue;
           if('timestampValue'in x)return x.timestampValue;
           if('arrayValue'in x)return (x.arrayValue.values||[]).map(unpack);
           if('mapValue'in x)return Object.fromEntries(Object.entries(x.mapValue.fields||{}).map(([k,v])=>[k,unpack(v)]));
           return null;
          }
          const tm=at=>new Date(at).toISOString().slice(11,19);
          const dateAt=x=>Number(x)||Date.parse(x)||0;
          const fr=a=>norm(a.context?.fr||(a.targetLang==='fr'?a.expected:'')||(/^guided/.test(a.ref||'')?a.expected:''));
          function seal(label,data){
           const aes=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',aes,iv);
           const bytes=Buffer.concat([cipher.update(gzipSync(Buffer.from(JSON.stringify(data)))),cipher.final()]);
           const wrapped=publicEncrypt({key:publicKey,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},aes);
           const payload=[wrapped,iv,cipher.getAuthTag(),bytes].map(b=>b.toString('base64')).join('.');
           // Only encrypted content ever enters this public workflow's logs.
           for(let i=0;i<payload.length;i+=3500)console.log('SEALED_'+label+'_'+String(i/3500).padStart(3,'0')+' '+payload.slice(i,i+3500));
          }
          let phase='auth';
          try{
           const service=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'null');
           if(!service||service.project_id!=='kk-syllabus')throw Error('credential');
           const vars=JSON.parse(readFileSync('./apps/wrangler-app-monitor.jsonc','utf8')).vars;
           if(vars.FCM_PROJECT_ID!=='kk-syllabus')throw Error('config');
           const jwt=await mintFrenchFirebaseToken(service,{cryptoImpl:webcrypto});
           const response=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key='+encodeURIComponent(vars.FCM_WEB_API_KEY),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:jwt,returnSecureToken:true}),signal:AbortSignal.timeout(20000)});
           if(!response.ok){console.log('Auth HTTP '+response.status);throw Error('auth');}
           const {idToken}=await response.json();
           const claims=JSON.parse(Buffer.from(idToken.split('.')[1],'base64url').toString('utf8'));
           if(claims.sub!==expectedUid||claims.user_id!==expectedUid||claims.aud!=='kk-syllabus')throw Error('scope');
           const parent='projects/kk-syllabus/databases/(default)/documents/families/'+expectedUid+'/learners/adult';
           const endpoint='https://firestore.googleapis.com/v1/'+parent+':runQuery';
           const header={Authorization:'Bearer '+idToken,'Content-Type':'application/json'};
           async function readApp(app,fields){
             const prefix=parent+'/progress/evidence-'+app+'-v1-';
             const f=op=>({fieldFilter:{field:{fieldPath:'__name__'},op:op==='lo'?'GREATER_THAN_OR_EQUAL':'LESS_THAN',value:{referenceValue:prefix+(op==='lo'?'':'\uf8ff')}}});
             const rows=[];let after=null;
             for(let i=0;i<40;i++){
              const structuredQuery={from:[{collectionId:'progress'}],where:{compositeFilter:{op:'AND',filters:[f('lo'),f('hi')]}},orderBy:[{field:{fieldPath:'__name__'},direction:'ASCENDING'}],limit:500,...(after?{startAt:{values:[{referenceValue:after}],before:false}}:{})};
              const res=await fetch(endpoint,{method:'POST',headers:header,body:JSON.stringify({structuredQuery}),signal:AbortSignal.timeout(45000)});
              if(!res.ok){console.log('Firestore HTTP '+res.status+' while reading '+(app.endsWith('journey')?'journey':'answers'));throw Error('read');}
              const json=await res.json();
              if(!Array.isArray(json)||json.some(r=>r.error)){console.log('Query envelope invalid: '+(Array.isArray(json)?'row error':'not array'));throw Error('query');}
              const docs=json.map(r=>r.document).filter(Boolean);
              for(const d of docs){
               const x=unpack({mapValue:{fields:d.fields}}),e=x.event;
               const checks={documentPrefix:typeof d.name==='string'&&d.name.startsWith(prefix),schema:x.schema===1,owner:x.ownerUid===expectedUid,learner:x.learnerId==='adult',app:x.app===app,event:!!e,eventApp:e?.appId===app,eventOwner:e?.accountId===expectedUid,eventLearner:e?.learnerId==='adult',eventId:typeof d.name==='string'&&e?.id===d.name.slice(prefix.length)};
               if(Object.values(checks).some(v=>!v)){console.log('Scope validation failed: '+Object.keys(checks).filter(k=>!checks[k]).join(', '));throw Error('scope mismatch');}
               rows.push(e);
              }
              if(docs.length<500)return rows;
              const last=docs.at(-1).name;if(last===after)throw Error('pagination');after=last;
             }
             throw Error('bounded query exceeded; no partial report');
           }
           phase='answers';
           const answers=await readApp('next-french-answers',['event.answerAudit']);
           phase='journey';
           const batches=await readApp('next-french-journey',['event.answerAudit.context','event.answerAudit.marker']);
           const a=answers.filter(x=>dateAt(x.at)>=dayStart&&dateAt(x.at)<dayEnd&&x.answerAudit).map(x=>({at:dateAt(x.at),...x.answerAudit})).sort((a,b)=>a.at-b.at);
           const events=new Map();
           for(const b of batches){const c=b.answerAudit?.context||{};for(const e of (c.journeyBatch|| (c.journey?[{id:b.id,at:b.at,track:c.track,sessionId:c.sessionId,...c.journey}]:[]))){if(e.id&&dateAt(e.at)>=dayStart&&dateAt(e.at)<dayEnd)events.set(e.id,{...e,at:dateAt(e.at)});}}
           const j=[...events.values()].sort((a,b)=>a.at-b.at||a.sequence-b.sequence);
           const visible=a.filter(x=>x.result!=='signal');
           const focus=visible.filter(x=>x.at>=start&&x.at<end);
           const day=visible.filter(x=>x.at<end);
           const related=x=>{const s=fr(x);return s.includes("préparé")||s.includes("réservé")||s.includes("déjeuner")||s.includes("une table")};
           const exact=x=>fr(x)===target;
           const short=x=>({time:tm(x.at),f:fr(x),en:x.context?.en||x.question,r:x.result,s:x.support,a:x.answer,activity:x.activity,stage:x.context?.stage,k:x.context?.kind,ref:x.ref,reason:x.reason,mode:x.signal?.mode});
           const stat=rows=>{
            const f=rows.filter(x=>fr(x));const counts=Object.entries(by(f,fr)).sort((a,b)=>b[1]-a[1]);const ex=rows.filter(exact);
            return {records:rows.length,first:rows.length?tm(rows[0].at):null,last:rows.length?tm(rows.at(-1).at):null,tracks:by(rows,x=>x.context?.track),activities:by(rows,x=>x.activity),outcomes:by(rows,x=>x.result),distinctFrench:counts.length,top:counts.slice(0,12),exact:ex.length,exactResults:by(ex,x=>x.result),exactActivities:by(ex,x=>x.activity),related:rows.filter(related).length,relatedResults:by(rows.filter(related),x=>x.result)};
           };
           const jFocus=j.filter(e=>e.at>=start&&e.at<end);
           const screens=jFocus.filter(e=>e.type==='screen');
           const tasks=screens.filter(e=>e.ref||e.activity).map(e=>({time:tm(e.at),p:e.page,ref:e.ref,activity:e.activity,stage:e.stage}));
           const exactRows=day.filter(exact);
           // Encrypted compact analysis inputs, no account identifiers or session IDs.
           const report={window:{start:tm(start),end:tm(end)},cloud:{answerDocuments:answers.length,journeyDocuments:batches.length},day:stat(day),focus:stat(focus),exactRows:exactRows.map(short),focusRelated:focus.filter(x=>related(x)&&!exact(x)).map(short),journey:{dayEvents:j.length,focusEvents:jFocus.length,types:by(jFocus,x=>x.type),pages:by(screens,x=>x.page),controls:by(jFocus.filter(e=>e.type==='click'),e=>e.control?.key),tasks:tasks.slice(0,120),plans:jFocus.filter(e=>e.type==='plan').map(e=>({time:tm(e.at),mode:e.mode,activity:e.activity,stage:e.stage})),matchingResults:jFocus.filter(e=>e.type==='exercise-result'&&focus.some(x=>exact(x)&&x.ref===e.ref)).map(e=>({time:tm(e.at),ref:e.ref,activity:e.activity,outcome:e.outcome}))}};
           phase='encrypt';
           const earlier=day.filter(x=>x.at<start&&related(x)).map(x=>({time:tm(x.at),f:fr(x),a:x.answer,r:x.result,s:x.support,activity:x.activity,stage:x.context?.stage,k:x.context?.kind,mode:x.signal?.mode}));
           const plans=a.filter(x=>x.signal?.kind==='adaptive-plan'&&x.at<end&&x.at>=start).map(x=>{const p=x.signal.plan||{};return {time:tm(x.at),position:p.position,target:p.target,targetKind:p.targetKind,reason:p.reason,mode:p.mode,fr:p.fr,priority:p.priority,unitId:p.unitId,newContext:p.newContext};});
           seal('DETAIL',{earlier,plans});
           // A second compact payload preserves all in-window exercise prompts and outcomes.
           // Focus timeline was already retrieved; return only the supporting detail.
           console.log('Encrypted scoped report complete. No Firestore mutations.');
          }catch(error){
           const allowed=['credential','config','auth','scope','query','scope mismatch','read','pagination','bounded query exceeded; no partial report'];
           console.log('Safe failure category: '+(allowed.includes(error.message)?error.message:error.name));
           console.log('Scoped read stopped safely at '+phase+'; no credentials or plaintext records logged.');
           process.exitCode=1;
          }
          NODE
